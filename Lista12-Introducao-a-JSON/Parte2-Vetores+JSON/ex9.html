<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 9</title>
</head>
<body>
    <h1>Catálogo de Cursos</h1>

    Nome do curso:
    <input type="text" id="ipt_curso">

    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="exibir()">Exibir Cursos</button>

    <br><br>

    De: <input type="number" id="ipt_de">
    Até: <input type="number" id="ipt_ate">

    <button onclick="filtrar()">Filtrar Cursos</button>

    <div id="msg"></div>
</body>
</html>

<script>
    let cursos = [];

    function cadastrar() {
        cursos[cursos.length] = ipt_curso.value;
        ipt_curso.value = '';
        msg.innerHTML = `Curso cadastrado com sucesso!`;
    }

    function exibir() {
        if (cursos.length == 0) {
            msg.innerHTML = `Nenhum curso cadastrado.`;
            return;
        }

        let lista = `Total de cursos cadastrados: ${cursos.length}<br><br>`;
        let i = 0;
        while (i < cursos.length) {
            lista += `${i + 1}. ${cursos[i]}<br>`;
            i++;
        }
        msg.innerHTML = lista;
    }

    function filtrar() {
        let de = Number(ipt_de.value);
        let ate = Number(ipt_ate.value);

        if (de < 1 || ate > cursos.length || de > ate) {
            msg.innerHTML = `Intervalo inválido.`;
            return;
        }

        let lista = `Total de cursos cadastrados: ${cursos.length}<br><br>`;
        let i = de - 1;
        while (i < ate) {
            lista += `${i + 1}. ${cursos[i]}<br>`;
            i++;
        }
        msg.innerHTML = lista;
    }
</script>

<!--
9. Catálogo de Cursos
Crie um programa o qual:

a) O usuário informe o nome de cursos que deseja guardar e clique em "Cadastrar";
b) Ao clicar em "Exibir Cursos", os cursos devem aparecer um abaixo do outro;
c) Tenha dois campos "De..." e "Até..." para informar uma faixa de posições;
d) Ao clicar em "Filtrar Cursos", mostre apenas os cursos que estejam dentro da faixa informada;
e) Exiba também a quantidade total de cursos cadastrados.

OBS: se o usuário informar "de 2 até 6", devem aparecer apenas os cursos da segunda até a sexta posição.
-->
