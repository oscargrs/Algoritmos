<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 11</title>
</head>
<body>
    <h1>Agenda de Eventos</h1>

    Nome do evento:
    <input type="text" id="ipt_nome">

    Data:
    <input type="text" id="ipt_data">

    Local:
    <input type="text" id="ipt_local">

    <button onclick="cadastrar()">Cadastrar Evento</button>
    <button onclick="exibir()">Exibir Agenda</button>

    <br><br>

    De: <input type="number" id="ipt_de">
    Até: <input type="number" id="ipt_ate">

    <button onclick="filtrar()">Filtrar Agenda</button>

    <div id="msg"></div>
</body>
</html>

<script>
    let eventos = [];

    function cadastrar() {
        let evento = {
            nome: ipt_nome.value,
            data: ipt_data.value,
            local: ipt_local.value
        };

        eventos[eventos.length] = evento;
        ipt_nome.value = '';
        ipt_data.value = '';
        ipt_local.value = '';
        msg.innerHTML = `Evento cadastrado com sucesso!`;
    }

    function exibir() {
        if (eventos.length == 0) {
            msg.innerHTML = `Nenhum evento cadastrado.`;
            return;
        }

        let lista = '';
        let i = 0;
        while (i < eventos.length) {
            lista += `${i + 1}. ${eventos[i].nome} - ${eventos[i].data} - ${eventos[i].local}<br>`;
            i++;
        }
        msg.innerHTML = lista;
    }

    function filtrar() {
        let de = Number(ipt_de.value);
        let ate = Number(ipt_ate.value);

        if (de < 1 || ate > eventos.length || de > ate) {
            msg.innerHTML = `Intervalo inválido.`;
            return;
        }

        let lista = '';
        let i = de - 1;
        while (i < ate) {
            lista += `${i + 1}. ${eventos[i].nome} - ${eventos[i].data} - ${eventos[i].local}<br>`;
            i++;
        }
        msg.innerHTML = lista;
    }
</script>

<!--
11. Agenda de Eventos
Crie um programa o qual:

a) O usuário informe o nome do evento, a data e o local;
b) Ao clicar em "Cadastrar Evento", as informações devem ser armazenadas em um objeto JSON;
c) Ao clicar em "Exibir Agenda", os eventos cadastrados devem aparecer um abaixo do outro, na ordem em que foram informados;
d) Tenha dois campos para informar um intervalo de posições;
e) Ao clicar em "Filtrar Agenda", devem ser exibidos apenas os eventos dentro do intervalo solicitado.

OBS: se o usuário informar "de 1 até 3", devem aparecer os três primeiros eventos cadastrados.
-->
