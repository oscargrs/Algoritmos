<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    <h1>Cadastro de Pets com Informações Agrupadas</h1>

    Nome:
    <input type="text" id="ipt_nome">

    Tipo do animal:
    <input type="text" id="ipt_tipo">
    
    Idade:
    <input type="text" id="ipt_idade">
    
    <button onclick="cadastrar()">Cadastrar</button>
    
    <div id="msg"></div>
</body>
</html>

<script>
    function cadastrar() {
        let pet = {
            nome: ipt_nome.value,
            tipo: ipt_tipo.value,
            idade: ipt_idade.value
        };

        msg.innerHTML = `
            Pet: ${pet.nome} <br>
            Tipo: ${pet.tipo} <br>
            Idade: ${pet.idade} anos`;

        console.log(pet);
    }
</script>

<!--
1. Cadastro de Pets com Informações Agrupadas
Crie um programa o qual:

a) O usuário informe:
nome do pet;
tipo do animal;
idade;

b) Ao clicar em "Cadastrar Pet", as informações sejam armazenadas em um objeto JSON;

c) Exiba abaixo do botão:

Pet: Rex
Tipo: Cachorro
Idade: 4 anos

d) Mostre também no console.log() o objeto completo do pet.
-->
