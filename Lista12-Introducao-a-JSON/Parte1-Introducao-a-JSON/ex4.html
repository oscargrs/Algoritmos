<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    <h1>Cadastro de Filmes com Classificação</h1>

    Nome do filme:
    <input type="text" id="ipt_filme">

    Gênero:
    <input type="text" id="ipt_genero">

    Nota:
    <input type="number" id="ipt_nota">

    <button onclick="cadastrar()">Cadastrar Filme</button>

    <div id="msg"></div>
</body>
</html>

<script>
    function cadastrar() {
        let filme = {
            filme: ipt_filme.value,
            genero: ipt_genero.value,
            nota: Number(ipt_nota.value)
        };

        filme.classificacao = "Filme Regular";

        if (filme.nota >= 8) {
            filme.classificacao = "Filme Excelente";
        }

        msg.innerHTML = `
            Filme: ${filme.filme} <br>
            Gênero: ${filme.genero} <br>
            Nota: ${filme.nota} <br>
            Classificação: ${filme.classificacao}`;
    }
</script>

<!--
4. Cadastro de Filmes com Classificação
Crie um programa o qual:

a) O usuário informe:

nome do filme;
gênero;
nota;
b) Ao clicar em "Cadastrar Filme", crie um objeto JSON chamado filme;

c) Verifique a nota do filme:

se for maior ou igual a 8, crie o atributo classificacao com valor "Filme Excelente";
caso contrário, "Filme Regular".
d) Exiba:

Filme: Interestelar
Gênero: Ficção
Nota: 9
Classificação: Filme Excelente
-->
