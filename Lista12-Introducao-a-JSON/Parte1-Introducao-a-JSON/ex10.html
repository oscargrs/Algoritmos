<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10</title>
</head>
<body>
    <h1>Cadastro de Celulares com Desconto</h1>

    Marca do celular:
    <input type="text" id="ipt_marca"><br>
    Modelo:
    <input type="text" id="ipt_modelo"><br>
    Preço:
    <input type="number" id="ipt_preco"><br>

    <button onclick="cadastrar()">Cadastrar Celular</button>

    <div id="display"></div>
</body>
</html>

<script>
    function cadastrar() {
        let celular = {
            marca: ipt_marca.value,
            modelo: ipt_modelo.value,
            preco: Number(ipt_preco.value)
        };

        celular.precoDesconto = celular.preco * 0.85;

        display.innerHTML = `
            Marca: ${celular.marca}<br>
            Modelo ${celular.modelo}<br>
            Preço Original: R$${celular.preco}<br>
            Preço com Desconto: R$${celular.precoDesconto}`;
    }
</script>

<!--
10. Cadastro de Celulares com Desconto
Crie um programa o qual:

a) O usuário informe:

marca do celular;
modelo;
preço;
b) Ao clicar em "Cadastrar Celular", crie um objeto JSON chamado celular;

c) Depois do cadastro:

crie um atributo chamado precoDesconto;
aplique 15% de desconto no preço original;
d) Exiba:

Marca: Samsung
Modelo: S25
Preço Original: R$4000
Preço com Desconto: R$3400
-->
